name: ci

on:
  push:
    branches: [main, master, refactor]
  pull_request:

jobs:
  source-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-deps -e .
      - run: python -m pip install numpy PyYAML pytest ruff build tomli "pillow>=10.0.0"
      - run: python tests/run_tests.py
      - run: python -m ruff check parascale tests setup.py

  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv .venv-clean
      - run: .venv-clean/bin/python -m pip install --upgrade pip
      - run: .venv-clean/bin/python -m pip install dist/parascale-*.whl
      - run: PATH="$PWD/.venv-clean/bin:$PATH" parascale doctor --strict --require torch
      - run: PATH="$PWD/.venv-clean/bin:$PATH" .venv-clean/bin/python tests/packaging/verify_clean_install.py

  extras-resolution:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [gpu, deepspeed, vlm, ascend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --dry-run --ignore-installed ".[${{ matrix.extra }}]"
