[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parascale"
dynamic = ["version"]
description = "Vision and multimodal distributed training control layer."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Wang Jun", email = "wj_xd@foxmail.com"},
]
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "numpy>=1.23.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
]
deepspeed = [
    "deepspeed>=0.14.0",
]
datacomp = [
    "pillow>=10.0.0",
    "webdataset>=0.2.86",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
]
vlm = [
    "transformers>=4.44.0",
    "peft>=0.12.0",
    "pillow>=10.0.0",
    "webdataset>=0.2.86",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
]
yolo = [
    "ultralytics>=8.3.0",
    "pillow>=10.0.0",
]
ascend = [
    "torch-npu>=2.4.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "black>=24.0.0",
    "build>=1.2.1",
    "pillow>=10.0.0",
    'tomli>=2.0; python_version < "3.11"',
]

[project.scripts]
parascale = "parascale.cli:main"

[project.urls]
Homepage = "https://github.com/WangJunWJJ/ParaScale"
Repository = "https://github.com/WangJunWJJ/ParaScale"
Issues = "https://github.com/WangJunWJJ/ParaScale/issues"

[tool.setuptools.dynamic]
version = {attr = "parascale._version.__version__"}

[tool.setuptools.packages.find]
include = ["parascale*"]
exclude = ["tests*", "examples*"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["parascale"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["parascale"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/benchmarks/scripts/validate_p2_profile_tuner.py" = ["E402"]
"tests/test_backend_smoke.py" = ["E402"]
"tests/test_clip_contrastive_workload.py" = ["E402"]
"tests/test_experimental_parallel_assets.py" = ["E402"]
"tests/test_vision_collator_torch.py" = ["E402"]
"tests/test_vision_profile_real_images.py" = ["E402"]
"tests/test_vision_synthetic_workload.py" = ["E402"]
"tests/test_vlm_lora_workload.py" = ["E402"]
"tests/test_yolo_workload.py" = ["E402"]
